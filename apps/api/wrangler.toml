name = "school-harness-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# 各教室ごとに `wrangler d1 create school-harness` を実行し、
# 発行された database_id をここに設定してください。
[[d1_databases]]
binding = "DB"
database_name = "school-harness-demo"
database_id = "82f7e029-7b62-464e-8af9-468d6d16d5d4"
migrations_dir = "migrations"

[vars]
# LINE Messaging API の無料メッセージ枠(月あたりのPush通知数)
LINE_FREE_PUSH_QUOTA = "200"
# LINE Login (LIFF) チャネルID。LIFFアプリのIDトークン検証(audience)に使用する。
# 秘密情報ではないが、LINE Developersコンソールで発行された値に置き換えること。
LIFF_CHANNEL_ID = "REPLACE_WITH_YOUR_LINE_LOGIN_CHANNEL_ID"
# CORSで許可するオリジン(カンマ区切り)。本番では管理画面とLIFFのURLに絞ることを推奨。
# 例: "https://admin.example.com,https://liff.example.com"
ALLOWED_ORIGINS = "https://school-harness-demo-admin.pages.dev"
# 体験用デモ環境でのみ "true" にする。ボタン一つで見本データを投入し
# デモ用APIキーを発行する /api/demo/session が有効になる。
# 実際の教室運営で使うインスタンスでは必ず "false"(または未設定)にすること。
DEMO_MODE = "true"

# LINE_CHANNEL_ACCESS_TOKEN / LINE_CHANNEL_SECRET はローカルでは
# .dev.vars に、本番では `wrangler secret put` で設定してください(平文で書かない)。

# お知らせの予約配信(scheduled_at到達分)を5分おきにチェックして送信する
[triggers]
crons = ["*/5 * * * *"]
